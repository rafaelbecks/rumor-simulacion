<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rumor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #07080a; }
    canvas { display: block; }
    #state-fader {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      z-index: 20;
      width: min(72vw, 320px);
      padding: 14px 22px 16px;
      border-radius: 18px;
      background: rgba(8, 10, 12, 0.72);
      border: 1px solid rgba(200, 212, 224, 0.18);
      backdrop-filter: blur(10px);
      font-family: ui-sans-serif, system-ui, sans-serif;
      color: #d8e2ea;
    }
    #state-fader .labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 8px;
    }
    #state-fader input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 28px;
      background: transparent;
      cursor: pointer;
    }
    #state-fader input[type="range"]::-webkit-slider-runnable-track {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #9ec7ff 0%, #f3c49a 100%);
    }
    #state-fader input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      margin-top: -9px;
      border-radius: 50%;
      background: #f4f7fb;
      box-shadow: 0 0 0 4px rgba(244, 247, 251, 0.16);
    }
    #state-fader input[type="range"]::-moz-range-track {
      height: 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #9ec7ff 0%, #f3c49a 100%);
    }
    #state-fader input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 50%;
      background: #f4f7fb;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="state-fader">
    <div class="labels">
      <span>umbral</span>
      <span>inmersión</span>
    </div>
    <input id="estado-range" type="range" min="0" max="1" step="0.001" value="0" />
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
